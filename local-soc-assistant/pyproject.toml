[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "local-soc-assistant"
version = "0.1.0"
description = "Offline research assistant with evidence verification for ATT&CK"
requires-python = ">=3.11,<3.13"
dependencies = ["pydantic==2.12.5", "streamlit==1.50.0", "psutil==7.1.0"]

[project.optional-dependencies]
llm = ["llama-cpp-python==0.3.18"]
test = ["pytest==8.4.2"]

[project.scripts]
soc-assistant = "soc_assistant.cli:main"

[tool.setuptools.packages.find]
include = ["soc_assistant*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires the real local GGUF and llama-cpp-python"]
